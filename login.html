<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Target Foundation Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 1rem;
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.041);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 80px rgb(42, 2, 48);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(123, 44, 191, 0.08) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .login-card:hover::before {
            opacity: 1;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 1.8rem;
            position: relative;
            z-index: 2;
        }

        .login-brand img {
            width: 70px;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-select: none;
            -ms-user-select: none;
            margin: 0 auto 0.8rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-brand .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4a148c;
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
            animation: fadeInDown 0.8s ease 0.2s both;
        }

        .login-brand .subtitle {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
            animation: fadeInDown 0.8s ease 0.3s both;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s ease both;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.4s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a148c;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 2px solid #edc4f5;
            background: #f9f9f9;
            font-size: 0.95rem;
            color: #333;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #999;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #7b2cbf;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.1);
            transform: translateY(-2px);
        }

        .btn-login {
            width: 100%;
            padding: 0.95rem 1.2rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #7b2cbf 0%, #5a1e8f 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(123, 44, 191, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 2;
            animation: fadeInUp 0.8s ease 0.6s both;
            letter-spacing: 0.5px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(123, 44, 191, 0.5);
            background: linear-gradient(135deg, #8b3ccf 0%, #6a2e9f 100%);
        }

        .btn-login:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(123, 44, 191, 0.4);
        }

        .error-message {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #c0392b;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: shake 0.5s;
            z-index: 2;
            position: relative;
        }

        .error-message:not(:empty) {
            display: block;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        /* Loading with Mathematical Shapes */
        .loading {
            margin-top: 1rem;
            text-align: center;
            color: #7b2cbf;
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .math-shapes {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            justify-content: center;
        }

        .shape {
            width: 30px;
            height: 30px;
            animation: shapeRotate 2s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            animation-delay: 0.2s;
        }

        .shape:nth-child(3) {
            animation-delay: 0.4s;
        }

        .circle {
            background: linear-gradient(135deg, #7b2cbf, #5a1e8f);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 26px solid #2196f3;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }

        .square {
            background: linear-gradient(135deg, #f093fb, #764ba2);
            border-radius: 4px;
            box-shadow: 0 4px 12px rgba(240, 147, 251, 0.3);
        }

        @keyframes shapeRotate {

            0%,
            100% {
                transform: rotate(0deg) scale(1);
            }

            25% {
                transform: rotate(90deg) scale(1.2);
            }

            50% {
                transform: rotate(180deg) scale(1);
            }

            75% {
                transform: rotate(270deg) scale(1.2);
            }
        }

        @media (max-width: 576px) {
            .login-container {
                max-width: 340px;
            }

            .login-card {
                padding: 1.5rem 1.3rem;
                border-radius: 18px;
            }

            .login-brand .title {
                font-size: 1.1rem;
            }

            .login-brand img {
                width: 60px;
            }

            input[type="email"],
            input[type="password"] {
                padding: 0.8rem 0.9rem;
                font-size: 0.9rem;
            }

            .btn-login {
                padding: 0.85rem 1rem;
                font-size: 0.9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="particles-canvas"></canvas>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="login-brand">
                <img src="Images/targetlogo.png" alt="Target Foundation Centre Logo" />
                <div class="title">Target Foundation Centre</div>
                <div class="subtitle">Admin Login Portal</div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="admin@school.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Login to Dashboard
                </button>
            </form>

            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading" style="display: none;">
                <div class="math-shapes">
                    <div class="shape circle"></div>
                    <div class="shape triangle"></div>
                    <div class="shape square"></div>
                </div>
                <div>Logging in...</div>
            </div>
        </div>
    </div>

    <script>
        const loginCard = document.getElementById('loginCard');

        loginCard.addEventListener('mousemove', (e) => {
            const rect = loginCard.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            loginCard.style.setProperty('--mouse-x', `${x}%`);
            loginCard.style.setProperty('--mouse-y', `${y}%`);
        });
    </script>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const numberOfParticles = 100;
        const mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('click', (e) => {
            const clickX = e.x;
            const clickY = e.y;

            particlesArray.forEach(particle => {
                const dx = particle.x - clickX;
                const dy = particle.y - clickY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 200) {
                    const angle = Math.atan2(dy, dx);
                    const force = (200 - distance) / 10;
                    particle.vx += Math.cos(angle) * force;
                    particle.vy += Math.sin(angle) * force;
                }
            });
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= 0.95;
                this.vy *= 0.95;

                if (this.x < 0 || this.x > canvas.width) {
                    this.vx *= -1;
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.vy *= -1;
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                }
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        let opacity = 1 - (distance / 120);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.2})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connect();

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="src/js/firebase-config.js"></script>
    <script src="src/js/login.js"></script>
</body>

</html>
